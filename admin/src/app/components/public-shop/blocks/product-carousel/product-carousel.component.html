@if (groups.length) {
  <section class="section" [class.highlight]="highlight">
    <div class="head">
      <h2 class="title">{{ title }}</h2>
      @if (showViewAll) {
        <button class="view-all" (click)="viewAll.emit()">View All ›</button>
      }
    </div>
    <div class="items" [class.grid]="grid" [style.--cols]="columns">
      @for (g of groups; track g) {
        <app-product-card
          [group]="g"
          [lowStockThreshold]="lowStockThreshold"
          [newBadgeDays]="newBadgeDays"
          (add)="add.emit($event)"
          (open)="open.emit($event)"
          class="item">
        </app-product-card>
      }
    </div>
  </section>
}
