<div class="merged-tab-row">
  <button [class.active]="activeTab === 'barcodes'" (click)="activeTab = 'barcodes'" class="tab-btn">🏷️ Barcode Labels</button>
  <button [class.active]="activeTab === 'tags'" (click)="activeTab = 'tags'" class="tab-btn">🖨️ Price Tags (with copies)</button>
</div>

@if (activeTab === 'barcodes') {
  <app-barcode-management></app-barcode-management>
}
@if (activeTab === 'tags') {
  <app-price-tag></app-price-tag>
}
