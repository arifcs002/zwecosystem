# Crawlers (Facebook/WhatsApp link previews, Google, Bing, Twitter, Telegram...) don't run JavaScript, so the
# Angular storefront would look empty to them: no product name, image or price in a shared link.
# They are handed a small server-rendered page from the API instead (Open Graph tags + JSON-LD).
# Humans, and every static asset, are untouched. (This `map` sits at http level: this file is included there.)
map $http_user_agent $is_crawler {
    default 0;
    "~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|discordbot|pinterest|skypeuripreview|googlebot|google-inspectiontool|bingbot|applebot|duckduckbot|yandexbot|baiduspider)" 1;
}

server {
    listen 80;
    # Wildcard covers every company subdomain (zairasworld.auleco.com, ...);
    # the Angular app itself resolves which company from the Host header
    # client-side (see TenantService) — nginx just needs to route every
    # hostname to the same SPA build.
    server_name auleco.com *.auleco.com localhost;

    server_tokens off;

    # Baseline browser hardening. (nginx drops these in any location that sets its own add_header,
    # so /uploads/ below repeats them.) No page of ours is ever meant to be framed.
    # A Content-Security-Policy is deliberately not here yet: the Meta Pixel / GA4 / Google Fonts scripts
    # need a tested allow-list first, and a wrong one would silently break tracking.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # Default is 1MB, which rejects APK uploads (Mobile App Releases) long
    # before they reach the backend's own [RequestSizeLimit(300MB)] check.
    client_max_body_size 300M;

    # ── per-shop sitemap.xml / robots.txt (generated by the API from the request's own hostname) ──
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/seo/sitemap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Seo-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /robots.txt {
        proxy_pass http://backend:8080/api/seo/robots;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Seo-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets are always served from disk, even to crawlers.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|map|json|webmanifest)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location / {
        # Crawlers asking for an app page get the server-rendered SEO page for that exact URL.
        if ($is_crawler) {
            rewrite ^ /__seo last;
        }
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Internal only: the original URL is kept in $request_uri and handed over as a header.
    location = /__seo {
        internal;
        proxy_pass http://backend:8080/api/seo/page;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Seo-Host $host;
        proxy_set_header X-Seo-Path $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # If the API is down or doesn't know the page, fall back to the normal app shell rather than an error.
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }
    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Real client address for the API's per-IP rate limits (coupon check, order
        # tracking, cart capture). Without this every shopper looks like the nginx
        # container and they would all share ONE bucket. X-Real-IP is set here from the
        # socket, so a client-supplied value can't override it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files (product images, APKs, logos) served through port 85
    # so clients never need to access port 5500 directly.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Allow large APK downloads without timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Cache static files in browser for 1 year (content-hash filenames)
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
