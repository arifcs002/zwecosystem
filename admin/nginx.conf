server {
    listen 80;
    # Wildcard covers every company subdomain (zairasworld.auleco.com, ...);
    # the Angular app itself resolves which company from the Host header
    # client-side (see TenantService) — nginx just needs to route every
    # hostname to the same SPA build.
    server_name auleco.com *.auleco.com localhost;

    # Default is 1MB, which rejects APK uploads (Mobile App Releases) long
    # before they reach the backend's own [RequestSizeLimit(300MB)] check.
    client_max_body_size 300M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files (product images, APKs, logos) served through port 85
    # so clients never need to access port 5500 directly.
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Allow large APK downloads without timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Cache static files in browser for 1 year (content-hash filenames)
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
