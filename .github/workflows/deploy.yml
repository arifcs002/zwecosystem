name: ZW Ecosystem — Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/${{ github.repository }}/backend:latest
  IMAGE_NAME_FRONTEND: ghcr.io/${{ github.repository }}/admin-dashboard:latest

jobs:
  test:
    name: Run Tests (blocks deploy on failure)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zwecodb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DB name must contain "test" — the test fixture refuses anything else.
      DB_CONNECTION_STRING: Host=localhost;Port=5432;Database=zwecodb_test;Username=postgres;Password=postgres
      JWT_SECRET: ci-only-secret-key-at-least-32-characters-long
      ASPNETCORE_ENVIRONMENT: Testing
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🧪 Backend integration tests
        run: dotnet test tests/Ecommerce.Api.Tests --configuration Release

      - name: ⚙️ Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: 🏗️ Angular production build
        working-directory: admin
        run: |
          npm ci --legacy-peer-deps
          npm run build -- --configuration=production

      # These logic tests run TypeScript directly, which needs Node 22+ (the job already uses 22).
      - name: 🧪 Browser-side logic tests (receipt printing, CSV import)
        working-directory: admin
        run: npm run test:unit

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_BACKEND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_FRONTEND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Copy Config & Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📝 Prepare production docker-compose
        run: |
          cat << 'EOF' > docker-compose.prod.yml
          version: '3.8'

          services:
            postgres:
              image: postgres:15-alpine
              container_name: zwecosystem-postgres
              ports:
                # loopback only — reach it via SSH tunnel, never the internet
                - "127.0.0.1:5436:5432"
              environment:
                POSTGRES_DB: ${POSTGRES_DB}
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              volumes:
                - pgdata:/var/lib/postgresql/data
              networks:
                - zwecosystem-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5

            # Redis is intentionally NOT a service here — it runs standalone on
            # the VPS host (installed directly, not in docker), specifically so
            # this workflow can never wipe it on redeploy. Uploaded images live
            # only in that Redis (see UploadController/ImagesController);
            # backend reaches it over the host's own address, not a docker
            # service name — see REDIS_CONNECTION_STRING below.

            backend:
              image: ghcr.io/${{ github.repository }}/backend:latest
              container_name: zwecosystem-api
              ports:
                - "127.0.0.1:5500:8080"
              environment:
                - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
                - JWT_SECRET=${JWT_SECRET}
                - REDIS_CONNECTION_STRING=${REDIS_HOST}:6379,password=${REDIS_PASSWORD}
                - SmtpSettings__Host=${SMTP_HOST}
                - SmtpSettings__Port=${SMTP_PORT}
                - SmtpSettings__EnableSsl=true
                - SmtpSettings__Username=${SMTP_USERNAME}
                - SmtpSettings__Password=${SMTP_PASSWORD}
                - SmtpSettings__FromAddress=${SMTP_FROM}
                - SmtpSettings__FromName=ZW Ecosystem
                - ASPNETCORE_ENVIRONMENT=Production
                - UPLOADS_DIR=/data/uploads
                - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
              volumes:
                - /data/apps/textlog:/data/apps/textlog
                - /data/apps/uploads:/data/uploads
              depends_on:
                postgres:
                  condition: service_healthy
              networks:
                - zwecosystem-network
              restart: unless-stopped

            admin-dashboard:
              image: ghcr.io/${{ github.repository }}/admin-dashboard:latest
              container_name: zwecosystem-admin
              ports:
                - "85:80"
              depends_on:
                - backend
              networks:
                - zwecosystem-network
              restart: unless-stopped

          volumes:
            pgdata:

          networks:
            zwecosystem-network:
              driver: bridge
          EOF

      - name: 🛡️ Verify persistent volumes are present (data-loss guard)
        run: |
          # HIGH PRIORITY SAFEGUARD — do not remove or weaken this check.
          #
          # 2026-07: a deploy shipped without the backend's uploads/textlog
          # volume mounts and silently wiped every uploaded product/company
          # image on every single deploy, because docker-compose.prod.yml is
          # regenerated from scratch here on every run — there is no
          # incremental state, so a missing mount is a guaranteed data loss,
          # not a rare edge case. This step fails the deploy BEFORE anything
          # touches the VPS if a required bind mount is ever missing again.
          #
          # Images now live only in a standalone Redis on the VPS host (not a
          # docker service — see UploadController/ImagesController), so the
          # only thing left to guard here on the compose side is the log mount
          # and that backend is actually configured to reach that Redis.
          set -e
          fail=0

          backend_block=$(awk '/^  backend:/{flag=1} /^  admin-dashboard:/{flag=0} flag' docker-compose.prod.yml)

          if ! grep -q '/data/apps/textlog' <<< "$backend_block"; then
            echo "::error::Backend service is missing the textlog volume mount — logs would not persist across deploys. Aborting."
            fail=1
          fi

          if ! grep -q '/data/uploads' <<< "$backend_block"; then
            echo "::error::Backend service is missing the uploads volume mount — uploaded images would be lost on redeploy. Aborting."
            fail=1
          fi

          redis_conn_line=$(grep -m1 'REDIS_CONNECTION_STRING=' <<< "$backend_block")
          if [ -z "$redis_conn_line" ]; then
            echo "::error::Backend service is missing REDIS_CONNECTION_STRING — uploaded images have nowhere to go. Aborting."
            fail=1
          elif [[ "$redis_conn_line" == *'=:6379'* ]]; then
            echo "::error::REDIS_CONNECTION_STRING has no host (REDIS_HOST secret/env is unset) — Aborting."
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            echo "::error::Fix docker-compose.prod.yml generation in this workflow before pushing again. See the comment on this step for context."
            exit 1
          fi

          echo "✅ Required persistent volume mounts and Redis config confirmed present."

      - name: 📁 Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.prod.yml"
          target: "/data/apps/zwecosystem/"

      - name: 🚀 Deploy Containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S mkdir -p /data/apps/zwecosystem
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S chown -R $USER:$USER /data/apps/zwecosystem

            cd /data/apps/zwecosystem

            # Move and overwrite the compose config
            mv -f docker-compose.prod.yml docker-compose.yml

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Back up the production DB BEFORE touching containers. If the DB
            # container exists and the dump fails, abort the deploy.
            set -e
            mkdir -p /data/backups /data/apps/uploads
            if [ -n "$(ls -A /data/apps/uploads 2>/dev/null)" ]; then
              tar czf /data/backups/uploads-$(date +%Y%m%d-%H%M%S).tar.gz -C /data/apps uploads
              ls -1t /data/backups/uploads-*.tar.gz | tail -n +8 | xargs -r rm -f
            fi
            if docker ps --format '{{.Names}}' | grep -qx zwecosystem-postgres; then
              BK=/data/backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz
              docker exec zwecosystem-postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner' | gzip > "$BK"
              if [ ! -s "$BK" ] || ! gzip -t "$BK"; then
                echo "::error::DB backup failed or empty — aborting deploy"; rm -f "$BK"; exit 1
              fi
              echo "Backup OK: $BK ($(du -h "$BK" | cut -f1))"
              # keep the newest 14 backups
              ls -1t /data/backups/pre-deploy-*.sql.gz | tail -n +15 | xargs -r rm -f
            else
              echo "No running postgres container yet (first deploy) — skipping backup."
            fi

            # Optional off-server copy of the backups. Does nothing until BACKUP_REMOTE=<rclone remote:path> is added to
            # /data/apps/zwecosystem/.env and rclone is installed on the VPS (see docs/DEPLOY-HTTPS-AND-BACKUP.md).
            # A failed copy only warns: the local backup above already exists, and a deploy must not hang on a cloud outage.
            BACKUP_REMOTE=$(grep -E '^BACKUP_REMOTE=' /data/apps/zwecosystem/.env 2>/dev/null | head -n1 | cut -d= -f2-)
            if [ -n "$BACKUP_REMOTE" ]; then
              if command -v rclone >/dev/null 2>&1; then
                rclone copy /data/backups "$BACKUP_REMOTE" --include "pre-deploy-*.sql.gz" --include "uploads-*.tar.gz" --max-age 2d \
                  && echo "Off-server backup copy OK -> $BACKUP_REMOTE" \
                  || echo "::warning::Off-server backup copy FAILED (local backup is safe)"
              else
                echo "::warning::BACKUP_REMOTE is set but rclone is not installed on the VPS"
              fi
            fi
            set +e   # the backup guard above needed -e; nothing below should abort on a harmless non-zero exit

            # Pull latest pre-built images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up old images and source directories to keep only docker-compose and .env
            docker image prune -f
            rm -rf admin backend mobile schema.sql user_messages.txt README.md .git

            # Configure firewall: 85 (legacy/APK), 80 (auleco.com over plain HTTP),
            # 443 (reserved for when a TLS cert is provisioned), 6379 (the
            # standalone host Redis — password-protected, NOT a docker
            # container, so local dev can share the same image cache as
            # production) — 5500/5432 stay blocked.
            if command -v ufw >/dev/null 2>&1; then
              echo "Configuring UFW firewall..."
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 85/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 80/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 443/tcp
              # Redis must not be public: close any previously opened 6379 rule
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw delete allow 6379/tcp || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw deny 5500/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw deny 5432/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw reload
            elif command -v firewall-cmd >/dev/null 2>&1; then
              echo "Configuring Firewalld..."
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=85/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=80/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=443/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --remove-port=6379/tcp 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --remove-port=5500/tcp --permanent 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --remove-port=5432/tcp --permanent 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --reload
            else
              echo "No ufw or firewalld command found. Relying on raw iptables rules..."
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -D INPUT -p tcp --dport 5500 -j ACCEPT 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -D INPUT -p tcp --dport 5432 -j ACCEPT 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 85 -j ACCEPT
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 80 -j ACCEPT
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 443 -j ACCEPT
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -D INPUT -p tcp --dport 6379 -j ACCEPT 2>/dev/null || true
            fi

            echo "==> Deployment complete!"
            docker compose ps

            echo "=== SYSTEM DIAGNOSTICS ==="
            echo "1. Host Firewall Status:"
            if command -v ufw >/dev/null 2>&1; then echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw status verbose; fi
            if command -v firewall-cmd >/dev/null 2>&1; then echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --list-all; fi
            
            echo "2. Listening Ports on Host:"
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ss -tulnp
            
            echo "3. Active Docker Containers:"
            docker ps -a
            
            echo "4. Local Host Nginx Configuration:"
            if [ -f /etc/nginx/nginx.conf ]; then cat /etc/nginx/nginx.conf; fi
            if [ -d /etc/nginx/conf.d ]; then ls -la /etc/nginx/conf.d/; fi
