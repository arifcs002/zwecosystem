name: ZW Ecosystem — Deploy to Production

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ghcr.io/${{ github.repository }}/backend:latest
  IMAGE_NAME_FRONTEND: ghcr.io/${{ github.repository }}/admin-dashboard:latest

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚀 Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_BACKEND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_FRONTEND }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Copy Config & Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📝 Prepare production docker-compose
        run: |
          cat << 'EOF' > docker-compose.prod.yml
          version: '3.8'

          services:
            postgres:
              image: postgres:15-alpine
              container_name: zwecosystem-postgres
              ports:
                - "5436:5432"
              environment:
                POSTGRES_DB: ${POSTGRES_DB}
                POSTGRES_USER: ${POSTGRES_USER}
                POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
              volumes:
                - pgdata:/var/lib/postgresql/data
              networks:
                - zwecosystem-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 5

            redis:
              image: redis:7-alpine
              container_name: zwecosystem-redis
              command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
              # Exposed on the public port (password-protected) so local dev
              # can read/write the SAME cache as production — that's what lets
              # an image uploaded from either place be visible from the other
              # (see ImagesController). Never remove --requirepass while this
              # port mapping exists.
              ports:
                - "6379:6379"
              volumes:
                - /data/apps/zwecosystem/redis:/data
              networks:
                - zwecosystem-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
                interval: 10s
                timeout: 5s
                retries: 5

            backend:
              image: ghcr.io/${{ github.repository }}/backend:latest
              container_name: zwecosystem-api
              ports:
                - "5500:8080"
              environment:
                - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
                - JWT_SECRET=${JWT_SECRET}
                - REDIS_CONNECTION_STRING=redis:6379,password=${REDIS_PASSWORD}
                - SmtpSettings__Host=${SMTP_HOST}
                - SmtpSettings__Port=${SMTP_PORT}
                - SmtpSettings__EnableSsl=true
                - SmtpSettings__Username=${SMTP_USERNAME}
                - SmtpSettings__Password=${SMTP_PASSWORD}
                - SmtpSettings__FromAddress=${SMTP_FROM}
                - SmtpSettings__FromName=ZW Ecosystem
                - ASPNETCORE_ENVIRONMENT=Production
              volumes:
                - /data/apps/textlog:/data/apps/textlog
                - /data/apps/zwecosystem/upload:/app/wwwroot/uploads
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_healthy
              networks:
                - zwecosystem-network
              restart: unless-stopped

            admin-dashboard:
              image: ghcr.io/${{ github.repository }}/admin-dashboard:latest
              container_name: zwecosystem-admin
              ports:
                - "85:80"
              depends_on:
                - backend
              networks:
                - zwecosystem-network
              restart: unless-stopped

          volumes:
            pgdata:

          networks:
            zwecosystem-network:
              driver: bridge
          EOF

      - name: 🛡️ Verify persistent volumes are present (data-loss guard)
        run: |
          # HIGH PRIORITY SAFEGUARD — do not remove or weaken this check.
          #
          # 2026-07: a deploy shipped without the backend's uploads/textlog
          # volume mounts and silently wiped every uploaded product/company
          # image on every single deploy, because docker-compose.prod.yml is
          # regenerated from scratch here on every run — there is no
          # incremental state, so a missing mount is a guaranteed data loss,
          # not a rare edge case. This step fails the deploy BEFORE anything
          # touches the VPS if a required bind mount is ever missing again.
          set -e
          fail=0

          backend_block=$(awk '/^  backend:/{flag=1} /^  admin-dashboard:/{flag=0} flag' docker-compose.prod.yml)
          redis_block=$(awk '/^  redis:/{flag=1} /^  backend:/{flag=0} flag' docker-compose.prod.yml)

          if ! grep -q '/app/wwwroot/uploads' <<< "$backend_block"; then
            echo "::error::Backend service is missing the wwwroot/uploads volume mount — this deploy would wipe all uploaded images/logos. Aborting."
            fail=1
          fi

          if ! grep -q '/data/apps/textlog' <<< "$backend_block"; then
            echo "::error::Backend service is missing the textlog volume mount — logs would not persist across deploys. Aborting."
            fail=1
          fi

          # Images are dual-written to Redis (shared across containers/machines,
          # see ImagesController/UploadController) alongside disk — if Redis
          # loses its own data on every container recreation, that write is
          # pointless and reintroduces the same class of data loss this guard
          # exists to prevent.
          if ! grep -q -- '--appendonly yes' <<< "$redis_block"; then
            echo "::error::Redis service is missing --appendonly persistence — cached images/dashboard data would be lost on every deploy. Aborting."
            fail=1
          fi

          if ! grep -q '/data/apps/zwecosystem/redis' <<< "$redis_block"; then
            echo "::error::Redis service is missing its /data volume mount — --appendonly persistence has nowhere durable to write. Aborting."
            fail=1
          fi

          # Redis is exposed on the public port 6379 (so local dev can share
          # the cache) — --requirepass is the only thing standing between
          # that and an open, unauthenticated cache on the internet. Checked
          # against the "command:" line specifically (not the whole block —
          # a stray comment mentioning --requirepass must not satisfy this).
          redis_command_line=$(grep -m1 '^\s*command:' <<< "$redis_block")
          if grep -q '"6379:6379"' <<< "$redis_block" && ! grep -q -- '--requirepass' <<< "$redis_command_line"; then
            echo "::error::Redis port 6379 is exposed WITHOUT --requirepass on its command line — this would leave the cache open to the internet. Aborting."
            fail=1
          fi

          if [ "$fail" -eq 1 ]; then
            echo "::error::Fix docker-compose.prod.yml generation in this workflow before pushing again. See the comment on this step for context."
            exit 1
          fi

          echo "✅ Required persistent volume mounts confirmed present."

      - name: 📁 Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "docker-compose.prod.yml"
          target: "/data/apps/zwecosystem/"

      - name: 🚀 Deploy Containers via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S mkdir -p /data/apps/zwecosystem
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S chown -R $USER:$USER /data/apps/zwecosystem

            cd /data/apps/zwecosystem

            # Move and overwrite the compose config
            mv -f docker-compose.prod.yml docker-compose.yml

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest pre-built images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans

            # Clean up old images and source directories to keep only docker-compose and .env
            docker image prune -f
            rm -rf admin backend mobile schema.sql user_messages.txt README.md .git

            # Configure firewall: 85 (legacy/APK), 80 (auleco.com over plain HTTP),
            # 443 (reserved for when a TLS cert is provisioned), 6379 (Redis —
            # password-protected via --requirepass, so local dev can share the
            # same image/dashboard cache as production) — 5500/5432 stay blocked.
            if command -v ufw >/dev/null 2>&1; then
              echo "Configuring UFW firewall..."
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 85/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 80/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 443/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw allow 6379/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw deny 5500/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw deny 5432/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw reload
            elif command -v firewall-cmd >/dev/null 2>&1; then
              echo "Configuring Firewalld..."
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=85/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=80/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=443/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --add-port=6379/tcp
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --remove-port=5500/tcp --permanent 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --permanent --zone=public --remove-port=5432/tcp --permanent 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --reload
            else
              echo "No ufw or firewalld command found. Relying on raw iptables rules..."
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -D INPUT -p tcp --dport 5500 -j ACCEPT 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -D INPUT -p tcp --dport 5432 -j ACCEPT 2>/dev/null || true
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 85 -j ACCEPT
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 80 -j ACCEPT
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 443 -j ACCEPT
              echo "${{ secrets.SSH_PASSWORD }}" | sudo -S iptables -I INPUT -p tcp --dport 6379 -j ACCEPT
            fi

            echo "==> Deployment complete!"
            docker compose ps

            echo "=== SYSTEM DIAGNOSTICS ==="
            echo "1. Host Firewall Status:"
            if command -v ufw >/dev/null 2>&1; then echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ufw status verbose; fi
            if command -v firewall-cmd >/dev/null 2>&1; then echo "${{ secrets.SSH_PASSWORD }}" | sudo -S firewall-cmd --list-all; fi
            
            echo "2. Listening Ports on Host:"
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S ss -tulnp
            
            echo "3. Active Docker Containers:"
            docker ps -a
            
            echo "4. Local Host Nginx Configuration:"
            if [ -f /etc/nginx/nginx.conf ]; then cat /etc/nginx/nginx.conf; fi
            if [ -d /etc/nginx/conf.d ]; then ls -la /etc/nginx/conf.d/; fi
